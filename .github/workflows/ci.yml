name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.8", "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Show version
        run: python -m reconkit --version

      - name: Run unit tests
        run: pytest -q

      - name: Run offline smoke test
        run: python tests/smoke_offline.py

      - name: Validate built-in rules
        run: python -c "from reconkit.fingerprint import load_rules; r=load_rules(); print('rules:', len(r)); assert len(r) > 20"

  package:
    name: package (installable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package
        run: python -m pip install --upgrade pip build && python -m build
      - name: Install wheel and run CLI
        run: |
          python -m pip install dist/*.whl
          reconkit --version
          reconkit fingerprint --help
