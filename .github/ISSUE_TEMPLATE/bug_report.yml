name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先确认：这不是**对未授权目标的使用问题**（本工具仅限自有/已授权资产）。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 输出 `python -m reconkit --version` 的结果
      placeholder: reconkit 0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统与 Python 版本
      placeholder: Windows 11 / Python 3.12.11
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 执行的命令
      render: shell
      placeholder: python -m reconkit fingerprint https://example.com
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 请粘贴完整输出（**务必去掉真实目标域名/IP**）
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已去掉输出中的真实目标信息
          required: true
        - label: 我确认该问题不涉及对未授权目标的使用
          required: true
